<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Instant Estimate Tool</title>
</head>
<body>
    <form id="contactForm" class="contact-form" style="display: flex; flex-direction: column; max-width: 400px; margin: auto; gap: 10px;">
        <h2>Contact Us</h2>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="street">Street Address:</label>
        <input type="text" id="street" name="street" required>

        <label for="city">City:</label>
        <input type="text" id="city" name="city" required>

        <label for="state">State:</label>
        <input type="text" id="state" name="state" required>

        <label for="zip">ZIP Code:</label>
        <input type="text" id="zip" name="zip" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <textarea id="meta" name="meta" rows="5"></textarea>

        <button type="submit">Send Message</button>
    </form>

    <!-- Auto-fill form fields from query parameters -->
    <script>
        function queryParamAutoFill() {
            const params = new URLSearchParams(window.location.search);
            const map = {
                name: 'name',
                email: 'email',
                phone: 'phone',
                street: 'street',
                city: 'city',
                state: 'state',
                zip: 'zip'
            };
            for (const [param, fieldId] of Object.entries(map)) {
                const value = params.get(param);
                if (value) document.getElementById(fieldId).value = value;
            }
        }
        queryParamAutoFill();
    </script>

    <!-- Append last 30 days of instant quote history to the meta field -->
    <script>
        function appendEstimateHistory() {
            const metaField = document.getElementById('meta');

            let estimates = [];
            try {
                const raw = localStorage.getItem('iq-estimates');
                if (raw) estimates = JSON.parse(raw);
            } catch (e) { return; }

            if (!estimates.length) return;

            const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
            estimates = estimates.filter(e => new Date(e.savedAt).getTime() >= cutoff);

            if (!estimates.length) return;

            const lines = estimates.map(e => {
                const date = e.savedAt;
                const address = [e.street, e.city, e.state, e.zip].filter(Boolean).join(', ');
                const buildingSummaries = (e.buildings || []).map(b => {
                    const productLines = (b.products || []).map(p =>
                        `          - ${p.name}: $${p.priceLow.toFixed(2)} - $${p.priceHigh.toFixed(2)}`
                    ).join('\n');
                    return `        ${b.name || 'Structure'} (${Math.round(b.area).toLocaleString()} ft²)\n${productLines}`;
                }).join('\n');
                return `${date} - ${e.service}\n    Address: ${address}\n    Service Type: ${e.service}\n${buildingSummaries}`;
            }).join('\n\n');

            const block = '--- Instant Estimate History ---\n\n' + lines + '\n\n--- End ---';

            const existing = metaField.value.trim();
            metaField.value = existing ? existing + '\n\n' + block : block;
        }
        appendEstimateHistory();
    </script>
</body>
</html>
