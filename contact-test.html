<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Instant Estimate Tool</title>
</head>
<body>
    <form id="contactForm" class="contact-form" style="display: flex; flex-direction: column; max-width: 400px; margin: auto; gap: 10px;">
        <h2>Contact Us</h2>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="street">Street Address:</label>
        <input type="text" id="street" name="street" required>

        <label for="city">City:</label>
        <input type="text" id="city" name="city" required>

        <label for="state">State:</label>
        <input type="text" id="state" name="state" required>

        <label for="zip">ZIP Code:</label>
        <input id="zip" required>

        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option value="roofing">Roofing</option>
            <option value="siding">Siding</option>
            <option value="gutters">Gutters</option>
        </select>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <textarea id="meta" name="meta" rows="5"></textarea>

        <button type="submit">Send Message</button>
    </form>

    <!-- Auto-fill form fields from query parameters -->
    <script>
        function queryParamAutoFill() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('name')) document.getElementById('name').value = params.get('name');
            if (params.has('email')) document.getElementById('email').value = params.get('email');
            if (params.has('street')) document.getElementById('street').value = params.get('street');
            if (params.has('city')) document.getElementById('city').value = params.get('city');
            if (params.has('state')) document.getElementById('state').value = params.get('state');
            if (params.has('zip')) document.getElementById('zip').value = params.get('zip');
            if (params.has('category')) document.getElementById('category').value = params.get('category');
            if (params.has('message')) document.getElementById('message').value = params.get('message');
        }
        queryParamAutoFill();
    </script>

    <!-- Append last 30 days of instant quote history to the meta field -->
    <script>
        function appendEstimateHistory() {
            const metaField = document.getElementById('meta');

            let estimates = [];
            try {
                const raw = localStorage.getItem('iq-estimates');
                if (raw) estimates = JSON.parse(raw);
            } catch (e) { return; }

            if (!estimates.length) return;

            const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
            estimates = estimates.filter(e => new Date(e.savedAt).getTime() >= cutoff);

            if (!estimates.length) return;

            const lines = estimates.map(e => {
                const date = e.savedAt;
                const address = [e.street, e.city, e.state, e.zip].filter(Boolean).join(', ');
                const buildingSummaries = (e.buildings || []).map(b => {
                    const productLines = (b.products || []).map(p =>
                        `          - ${p.name}: $${p.priceLow.toFixed(2)} - $${p.priceHigh.toFixed(2)}`
                    ).join('\n');
                    return `        ${b.name || 'Structure'} (${Math.round(b.area).toLocaleString()} ft²)\n${productLines}`;
                }).join('\n');
                return `${date} - ${e.service}\n    Address: ${address}\n    Service Type: ${e.service}\n${buildingSummaries}`;
            }).join('\n\n');

            const block = '--- Instant Estimate History ---\n\n' + lines + '\n\n--- End ---';

            const existing = metaField.value.trim();
            metaField.value = existing ? existing + '\n\n' + block : block;
        }
        appendEstimateHistory();
    </script>
</body>
</html>
